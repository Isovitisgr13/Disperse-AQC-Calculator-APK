name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check calculation engine
        run: npm test

      - name: Generate Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0A6A74' --splashBackgroundColor '#0A6A74'
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AQC-Calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AQC-Calculator-apk
          path: AQC-Calculator.apk
